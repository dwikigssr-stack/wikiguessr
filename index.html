<style>
/* Layout: écran unique. Article en haut, carte du monde plein cadre, barre d'action en bas. */
:root {
  --bg: #eef2f4;
  --card: #ffffff;
  --sea: #cddde5;
  --land: #f6f8f5;
  --border: #9fb3bc;
  --ink: #14262e;
  --muted: #587079;
  --line: #d3dde2;
  --guess: #d4380d;
  --truth: #148a5c;
  --btn-ink: #ffffff;
  --btn: #14262e;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1a20; --card: #14252d; --sea: #0f2029; --land: #223f4a; --border: #38606d;
    --ink: #e7eff1; --muted: #8fa7af; --line: #243b45; --guess: #ffc247; --truth: #4ad6a0;
    --btn-ink: #0d1a20; --btn: #e7eff1; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1a20; --card: #14252d; --sea: #0f2029; --land: #223f4a; --border: #38606d;
  --ink: #e7eff1; --muted: #8fa7af; --line: #243b45; --guess: #ffc247; --truth: #4ad6a0;
  --btn-ink: #0d1a20; --btn: #e7eff1; color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
#app { position: relative; height: 100%; display: flex; flex-direction: column; gap: 10px; padding-inline: 16px; padding-block: 12px; max-width: 980px; margin-inline: auto; }
header { display: flex; justify-content: space-between; align-items: center; gap: 8px 12px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -0.01em; }
.meta { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); display: flex; gap: 14px; font-variant-numeric: tabular-nums; }
.meta b { color: var(--ink); font-weight: 500; }
#card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; }
.txt { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 6px; }
#photo { position: relative; flex: none; width: 92px; height: 92px; border-radius: 8px; overflow: hidden; background: var(--sea); display: grid; place-items: center; }
#photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
#mono { font: 700 30px var(--font-display); color: var(--muted); letter-spacing: -0.02em; }
select { font: 500 12.5px var(--font-mono); color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.chip { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
#title { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.1; letter-spacing: -0.015em; text-wrap: balance; margin: 0; }
#extract { margin: 0; font-size: 15.5px; line-height: 1.45; color: var(--ink); max-width: 65ch; }
#mapwrap { position: relative; flex: 1; min-height: 0; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--sea); }
#map { position: absolute; inset: 0; background: var(--sea); }
.leaflet-container { cursor: crosshair; font-family: var(--font-mono); }
.zoom, .hint { z-index: 1000; }
.leaflet-control-attribution { font-size: 10px; }
.zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; }
.zoom button { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: 500 18px var(--font-mono); cursor: pointer; }
.hint { position: absolute; left: 10px; bottom: 10px; font-family: var(--font-mono); font-size: 11.5px; background: var(--card); color: var(--muted); border: 1px solid var(--line); padding: 5px 9px; border-radius: 8px; pointer-events: none; }
#bar { display: flex; flex-direction: column; gap: 10px; }
button.main { appearance: none; border: 0; background: var(--btn); color: var(--btn-ink); font: 700 16px var(--font-display); padding: 13px 18px; border-radius: 10px; cursor: pointer; width: 100%; }
button.main:disabled { opacity: 0.35; cursor: not-allowed; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--guess); outline-offset: 2px; }
#result { display: flex; flex-direction: column; gap: 4px; }
.score-line { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.dist { font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: -0.01em; }
.pts { font-family: var(--font-mono); font-size: 18px; color: var(--truth); font-variant-numeric: tabular-nums; }
.where { font-size: 14.5px; color: var(--muted); margin: 0; }
.where a { color: var(--ink); text-underline-offset: 3px; }
#final { position: absolute; inset: 0; z-index: 2000; background: var(--bg); display: flex; flex-direction: column; gap: 14px; padding-inline: 16px; padding-block: 18px; overflow-y: auto; max-width: 980px; margin-inline: auto; }
#final .big { font-family: var(--font-display); font-weight: 700; font-size: 56px; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
#final .of { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
#final h2 { font-family: var(--font-display); font-size: 22px; margin: 0; }
table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
td { padding: 8px 0; border-bottom: 1px solid var(--line); }
td.n { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 12px; }
td.t { min-width: 0; }
.tablewrap { overflow-x: auto; }
@media (max-height: 640px) { #extract { font-size: 14px; } #title { font-size: 22px; } }
@media (max-width: 440px) { #photo { width: 64px; height: 64px; } #mono { font-size: 22px; } #title { font-size: 21px; } #extract { font-size: 14.5px; } }
@media (prefers-reduced-motion: no-preference) { .pin { animation: pop 0.18s ease-out; transform-box: fill-box; transform-origin: center; } }
@keyframes pop { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.pts { font-weight: 700; }
</style>

<div id="app">
  <header>
    <div class="brand">Wikiguessr</div>
    <select id="mode" aria-label="Type de questions">
      <option value="mixte">Tout</option>
      <option value="lieux">Lieux</option>
      <option value="perso">Personnalités</option>
    </select>
    <div class="meta"><span>Manche <b id="rnd">1</b>/5</span><span><b id="tot">0</b> pts</span></div>
  </header>
  <section id="card" aria-live="polite">
    <div id="photo"><span id="mono"></span><img id="img" alt="" hidden></div>
    <div class="txt">
      <div class="chip" id="chip"></div>
      <h1 id="title"></h1>
      <p id="extract"></p>
    </div>
  </section>
  <div id="mapwrap">
    <div id="map" aria-label="Carte du monde. Touchez pour placer votre repère."></div>
    <div class="zoom"><button id="zin" aria-label="Zoom avant">+</button><button id="zout" aria-label="Zoom arrière">&minus;</button></div>
    <div class="hint" id="hint">Touchez la carte pour poser un repère</div>
  </div>
  <div id="bar">
    <button class="main" id="go" disabled>Valider</button>
    <div id="result" hidden>
      <div class="score-line"><span class="dist" id="dist"></span><span class="pts" id="pts"></span></div>
      <p class="where" id="where"></p>
      <button class="main" id="next">Manche suivante</button>
    </div>
  </div>
  <div id="final" hidden>
    <div class="of">Partie terminée</div>
    <div><div class="big" id="ftot"></div><div class="of">sur 25 000 points</div></div>
    <h2 id="frank"></h2>
    <div class="tablewrap"><table><tbody id="frows"></tbody></table></div>
    <div class="of" id="fbest"></div>
    <button class="main" id="again">Rejouer</button>
  </div>
</div>

  if (guess && revealed && cur) {
    L.polyline([[guess.a, guess.o], [cur.a, cur.o]], { color: cssv('--ink'), weight: 2, dashArray: '6 5' }).addTo(layer);
    dot(cssv('--truth'), cur).addTo(layer);
  }
  if (guess) dot(cssv('--guess'), guess).addTo(layer);
}

/* ---- score ---- */
function km(a1, o1, a2, o2) {
  const R = 6371, rad = Math.PI / 180;
  const dA = (a2 - a1) * rad, dO = (o2 - o1) * rad;
  const h = Math.sin(dA / 2) ** 2 + Math.cos(a1 * rad) * Math.cos(a2 * rad) * Math.sin(dO / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const points = d => d < 25 ? 5000 : Math.round(5000 * Math.exp(-d / DECAY));

/* ---- manches ---- */
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function start() {
  const pool = ALL.filter(d => mode === 'mixte' || (mode === 'lieux') === (d.k === 'lieu'));
  rounds = shuffle(pool).slice(0, TOTAL); idx = 0; total = 0; results = [];
  $('final').hidden = true; $('tot').textContent = '0';
  load();
}
function load() {
  const r = rounds[idx];
  guess = null; revealed = false;
  $('rnd').textContent = idx + 1;
  $('chip').textContent = r.k === 'perso' ? 'Personnalité · ' + r.c + ' · lieu de naissance' : r.c;
  $('title').textContent = r.t;
  $('extract').textContent = r.x;
  setPhoto(r);
  $('go').hidden = false; $('go').disabled = true;
  $('result').hidden = true; $('hint').hidden = false;
  resetView();
  $('card').className = r.k;
}
/* Photo : champ img de l'entrée, sinon miniature Wikipédia si la page peut interroger Wikipédia. Sans photo, une pastille d'initiales reste affichée. */
function setPhoto(r) {
  const im = $('img'); im.hidden = true; im.removeAttribute('src');
  $('mono').textContent = r.t.split(/[\s'’-]+/).filter(w => /^[A-ZÀ-Ý]/.test(w)).slice(0, 2).map(w => w[0]).join('') || r.t[0];
  const show = u => { if (rounds[idx] === r) { im.onload = () => { im.hidden = false; }; im.src = u; } };
  if (r.img) return show(r.img);
  if (r.thumb) return show(r.thumb);
  if (r.thumb === undefined) {
    r.thumb = null;
    try {
      fetch('https://fr.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent((r.w || r.t).replace(/ /g, '_')))
        .then(x => x.ok ? x.json() : null)
        .then(j => { if (j && j.thumbnail) { r.thumb = j.thumbnail.source; show(r.thumb); } })
        .catch(() => {});
    } catch (e) {}
  }
}
function place(lat, lon) {
  if (revealed) return;
  lon = ((lon + 540) % 360) - 180;
  guess = { a: lat, o: lon };
  $('go').disabled = false; $('hint').hidden = true;
  drawOverlay();
}
function reveal() {
  if (!guess || revealed) return;
  revealed = true;
  const r = rounds[idx];
  const d = km(guess.a, guess.o, r.a, r.o), pts = points(d);
  total += pts; results.push({ t: r.t, d, pts });
  $('tot').textContent = fmt(total);
  $('dist').textContent = d < 1 ? 'Pile dessus' : 'À ' + fmt(d) + ' km';
  $('pts').textContent = '+' + fmt(pts) + ' pts';
  $('where').textContent = '';
  const s = document.createElement('span'); s.textContent = (r.k === 'perso' ? 'Né(e) à ' : '') + r.p + ' · ';
  const a = document.createElement('a');
  a.href = 'https://fr.wikipedia.org/wiki/' + encodeURIComponent((r.w || r.t).replace(/ /g, '_'));
  a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Lire l’article sur Wikipédia';
  $('where').append(s, a);
  $('next').textContent = idx + 1 < TOTAL ? 'Manche suivante' : 'Voir mon score';
  $('go').hidden = true; $('result').hidden = false;
  drawOverlay(); fitTo(guess, r);
}
function advance() {
  if (idx + 1 < TOTAL) { idx++; load(); } else finish();
}
function rank(t) {
  if (t >= 21000) return 'Cartographe de légende';
  if (t >= 15000) return 'Globe-trotteur';
  if (t >= 9000) return 'Voyageur averti';
  if (t >= 4000) return 'Touriste égaré';
  return 'Boussole en panne';
}
function finish() {
  $('ftot').textContent = fmt(total);
  $('frank').textContent = rank(total);
  const tb = $('frows'); tb.textContent = '';
  for (const r of results) {
    const tr = document.createElement('tr');
    const c1 = document.createElement('td'); c1.className = 't'; c1.textContent = r.t;
    const c2 = document.createElement('td'); c2.className = 'n'; c2.textContent = fmt(r.d) + ' km';
    const c3 = document.createElement('td'); c3.className = 'n'; c3.textContent = fmt(r.pts);
    tr.append(c1, c2, c3); tb.appendChild(tr);
  }
  let best = 0;
  try { best = +localStorage.getItem('wikiguessr-best') || 0; if (total > best) { best = total; localStorage.setItem('wikiguessr-best', String(best)); } } catch (e) {}
  $('fbest').textContent = best ? 'Meilleur score sur cet appareil : ' + fmt(best) : '';
  $('final').hidden = false;
}

/* ---- interactions carte : Leaflet gère glisser, pincer, molette ---- */
map.on('click', e => place(e.latlng.lat, e.latlng.lng));
$('zin').onclick = () => map.zoomIn();
$('zout').onclick = () => map.zoomOut();
$('mode').onchange = e => { mode = e.target.value; start(); };
$('go').onclick = reveal;
$('next').onclick = advance;
$('again').onclick = start;
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !$('final').hidden) return;
  if (!revealed) reveal(); else advance();
});
new ResizeObserver(() => map.invalidateSize()).observe(wrap);
start();
</script>

</body>
</html>
